name: scouting-manual-sync
x-worker: &worker
  build:
    context: .
    dockerfile: docker/Dockerfile.scraper
  volumes:
    - ./data/recovery:/app/data/recovery
  entrypoint: ["python", "scripts/manual_scouting_sync.py"]
services:
  collector:
    <<: *worker
  publisher:
    <<: *worker
    profiles: ["publish"]
    environment: &scouting-database
      SCOUTING_DATABASE_URL: ${SCOUTING_DATABASE_URL:-}
      DB_SCHEMA: scouting
  scheduler:
    <<: *worker
    profiles: ["scheduler"]
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    entrypoint: ["python", "scripts/run_scouting_scheduler.py"]
    environment:
      <<: *scouting-database
      PYTHONUNBUFFERED: "1"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
  scheduler-primera-b:
    <<: *worker
    profiles: ["primera-b"]
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    entrypoint: ["python", "scripts/run_scouting_scheduler.py", "--league", "cl_primera_b"]
    environment:
      <<: *scouting-database
      PYTHONUNBUFFERED: "1"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
