name: scouting-manual-sync
x-worker: &worker
  build:
    context: .
    dockerfile: docker/Dockerfile.scraper
  volumes:
    - ./data/recovery:/app/data/recovery
  entrypoint: ["python", "scripts/manual_scouting_sync.py"]
x-weekly: &weekly
  <<: *worker
  restart: unless-stopped
  init: true
  stop_grace_period: 45s
  environment: &scouting-database
    SCOUTING_DATABASE_URL: ${SCOUTING_DATABASE_URL:-}
    DB_SCHEMA: scouting
    PYTHONUNBUFFERED: "1"
  logging:
    driver: json-file
    options:
      max-size: "5m"
      max-file: "3"
services:
  collector:
    <<: *worker
  publisher:
    <<: *worker
    profiles: ["publish"]
    environment: *scouting-database
  scheduler:
    <<: *weekly
    profiles: ["scheduler", "leagues"]
    entrypoint: ["python", "scripts/run_scouting_scheduler.py"]
  scheduler-primera-b:
    <<: *weekly
    profiles: ["primera-b", "leagues"]
    entrypoint: ["python", "scripts/run_scouting_scheduler.py", "--league", "cl_primera_b"]
  scheduler-argentina:
    <<: *weekly
    profiles: ["leagues"]
    entrypoint: ["python", "scripts/run_scouting_scheduler.py", "--league", "ar_primera"]
  scheduler-argentina-nacional:
    <<: *weekly
    profiles: ["leagues"]
    entrypoint: ["python", "scripts/run_scouting_scheduler.py", "--league", "ar_primera_nacional"]
  scheduler-uruguay:
    <<: *weekly
    profiles: ["leagues"]
    entrypoint: ["python", "scripts/run_scouting_scheduler.py", "--league", "uy_primera"]
