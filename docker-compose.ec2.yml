name: ohiggins-scouting-prod

# Misma estrategia que docker-compose.yml: solo interpolación, sin env_file mixto.
x-database-environment: &database-environment
  DB_HOST: ${DB_HOST:?DB_HOST requerido}
  DB_PORT: ${DB_PORT:?DB_PORT requerido}
  DB_NAME: ${DB_NAME:?DB_NAME requerido}
  DB_USER: ${DB_USER:?DB_USER requerido}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD requerido}

x-app-runtime-environment: &app-runtime-environment
  <<: *database-environment
  SOFASCORE_FETCH_MODE: ${SOFASCORE_FETCH_MODE:-browser}
  SOFASCORE_ACTIVE_SEASON: ${SOFASCORE_ACTIVE_SEASON:-2025}
  SOFASCORE_HISTORICAL_SEASON: ${SOFASCORE_HISTORICAL_SEASON:-2024}
  SCOUTING_USERNAME: ${SCOUTING_USERNAME:?SCOUTING_USERNAME requerido}
  SCOUTING_PASSWORD_HASH: ${SCOUTING_PASSWORD_HASH:?SCOUTING_PASSWORD_HASH requerido}
  SCOUTING_DEBUG_MODE: ${SCOUTING_DEBUG_MODE:-0}
  SHOW_ADMIN_TAB: ${SHOW_ADMIN_TAB:-0}
  DISABLE_SOFASCORE_UPDATE: ${DISABLE_SOFASCORE_UPDATE:-1}
  SHOW_SYNC_TECHNICAL_DETAILS: ${SHOW_SYNC_TECHNICAL_DETAILS:-0}

services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${SCOUTING_APP_PORT:-18501}:8501"
    environment:
      <<: *app-runtime-environment
      PYTHONPATH: /app/src
      SOFASCORE_WORKER_MODE: local
      SOFASCORE_IMPORT_MODE: direct
      SOFASCORE_FETCH_MODE: ${SOFASCORE_FETCH_MODE:-browser}
      COMPOSE_PROJECT_NAME: ohiggins-scouting-prod
      COMPOSE_FILE: /app/docker-compose.ec2.yml
      PROJECT_ROOT: /app
      CHROME_BINARY: /usr/bin/chromium
      CHROMEDRIVER_PATH: /usr/bin/chromedriver
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    volumes:
      - ./data:/app/data
      - ./web_scraping_sofascore/sofascore_output:/app/web_scraping_sofascore/sofascore_output
    command:
      - streamlit
      - run
      - app/streamlit_app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true

  db-init:
    build: .
    restart: "no"
    environment:
      <<: *database-environment
      PYTHONPATH: /app/src
    command: ["python", "scripts/init_database.py"]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME requerido}
      POSTGRES_USER: ${DB_USER:?DB_USER requerido}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD requerido}
    volumes:
      - ohiggins_scouting_postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  sofascore-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.scraper
    profiles: ["worker"]
    restart: "no"
    environment:
      <<: *database-environment
      PYTHONPATH: /app/src
      SOFASCORE_IMPORT_MODE: direct
      SOFASCORE_ACTIVE_SEASON: ${SOFASCORE_ACTIVE_SEASON:-2025}
      SOFASCORE_FETCH_MODE: ${SOFASCORE_FETCH_MODE:-browser}
      SOFASCORE_HISTORICAL_SEASON: ${SOFASCORE_HISTORICAL_SEASON:-2024}
      CHROME_BINARY: /usr/bin/chromium
      CHROMEDRIVER_PATH: /usr/bin/chromedriver
    volumes:
      - ./data:/app/data
      - ./web_scraping_sofascore/sofascore_output:/app/web_scraping_sofascore/sofascore_output
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    working_dir: /app

volumes:
  ohiggins_scouting_postgres_data:
