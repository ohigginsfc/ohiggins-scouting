name: Offline and PostgreSQL import tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: scouting_test
          POSTGRES_USER: scouting_test
          POSTGRES_PASSWORD: synthetic-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scouting_test -d scouting_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: src
      SCOUTING_TEST_DATABASE_URL: postgresql://scouting_test:synthetic-ci-password@127.0.0.1:5432/scouting_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Configure synthetic Compose test environment
        run: |
          cat > .env <<'EOF'
          DB_HOST=postgres
          DB_PORT=5432
          DB_NAME=scouting_test
          DB_USER=scouting_test
          DB_PASSWORD=synthetic-compose-password
          SCOUTING_USERNAME=synthetic
          SCOUTING_PASSWORD_HASH=$$2b$$12$$testhashforcomposeinterpolationonlyxx
          DISABLE_SOFASCORE_UPDATE=1
          EOF
      - run: python -m pytest -q
      - name: Build isolated recovery worker and check Selenium
        env:
          SOFASCORE_ARTIFACT_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: |
          docker compose -f docker-compose.recovery.yml build collector
          docker compose -f docker-compose.recovery.yml run --rm --entrypoint python collector scripts/test_selenium_runtime.py
