name: Sync COMET to Supabase

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Descargar y validar sin publicar (desmarcar para publicar desde main)
        type: boolean
        default: true
  schedule:
    - cron: '0 6 * * 1,3'

permissions:
  contents: read

concurrency:
  group: comet-sync-public
  cancel-in-progress: false

jobs:
  sync:
    # Inactivo por defecto mientras el repo legado siga programado. Activación
    # explícita DESPUÉS de desactivar el legado: COMET_SCHEDULE_ENABLED=true.
    if: github.event_name != 'schedule' || vars.COMET_SCHEDULE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-comet-sync.txt
      - name: Install isolated COMET worker dependencies
        run: python -m pip install -r requirements-comet-sync.txt
      - name: Validate publication branch
        env:
          MODE: ${{ github.event_name == 'schedule' && 'publish' || (inputs.dry_run && 'dry-run' || 'publish') }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$MODE" = publish ] && [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo 'La publicación requiere la rama principal revisada.'
            exit 1
          fi
      - name: Download, validate and optionally publish
        env:
          COMET_ENDPOINT_SOURCE: ${{ vars.COMET_ENDPOINT_SOURCE || 'sheets' }}
          COMET_SHEET_ID: ${{ vars.COMET_SHEET_ID || '1OI1kt4NvR0ggKF_wU3zWTn_uUkEexjFENhF81L8A2c8' }}
          COMET_WORKSHEET: ${{ vars.COMET_WORKSHEET || 'ENDPOINTS' }}
          COMET_REQUEST_DELAY: ${{ vars.COMET_REQUEST_DELAY || '3' }}
          GOOGLE_SV_B64: ${{ secrets.GOOGLE_SV_B64 }}
          COMET_ENDPOINTS: ${{ secrets.COMET_ENDPOINTS }}
          COMET_SUPABASE_URL: ${{ secrets.COMET_SUPABASE_URL }}
          COMET_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.COMET_SUPABASE_SERVICE_ROLE_KEY }}
          MODE: ${{ github.event_name == 'schedule' && 'publish' || (inputs.dry_run && 'dry-run' || 'publish') }}
        run: |
          if [ "$MODE" = publish ]; then
            python scripts/sync_comet.py --publish --summary-json data/runtime/comet-sync-summary.json
          else
            python scripts/sync_comet.py --dry-run --summary-json data/runtime/comet-sync-summary.json
          fi
      - name: Aggregate sync receipt (no records or credentials)
        uses: actions/upload-artifact@v4
        with:
          name: comet-sync-summary
          path: data/runtime/comet-sync-summary.json
          if-no-files-found: error
          retention-days: 14
